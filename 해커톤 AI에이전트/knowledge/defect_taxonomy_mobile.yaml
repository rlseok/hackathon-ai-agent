# Mobile surface defect knowledge. Replace draft criteria with customer acceptance standards.
version: 0.1

judgment:
  conf_reject: 0.50
  conf_review: 0.25
  rules:
    scratch:
      max_level: review
      note: Check scratch length, width, and whether the display or functional layer is exposed.
      note_vi: Kiểm tra chiều dài, chiều rộng và lớp hiển thị hoặc lớp chức năng có bị lộ không.
    stain:
      max_level: review
      note: Re-clean the surface and inspect again.
      note_vi: Vệ sinh lại bề mặt rồi kiểm tra lại.

situations:
  normal:
    label: 정상
    action: 통과 처리. 검사 이력만 기록한다.
  review:
    label: 의심
    output: 재검사 의뢰서 (Hold)
    action: 의심 영역을 표시하고 작업자 확인 후 재검사한다.
  reject:
    label: 이상
    output: 부적합 보고서 (NCR)
    action: 제품을 격리하고 유형별 원인 후보와 조치를 기록한다.
  multi_type:
    label: 복합 결함
    action: 심각도가 높은 유형을 대표 판정으로 하고 모든 유형을 보고서에 기록한다.

defects:
  oil:
    name_ko: 오일 오염
    name_vi: Dính dầu
    name_en: Oil contamination
    group: 오염
    severity: major
    description: 표면에 오일 또는 유분이 남은 상태
    causes:
      - 장비 또는 지그의 오일 누유
      - 장갑·공구·트레이 오염
      - 세척 및 건조 불량
    actions:
      immediate: 해당 제품을 격리하고 승인된 방법으로 세척 후 재검사한다.
      check: 장비 누유, 지그, 장갑 및 세척액 상태를 확인한다.
      prevent: 누유 점검과 세척·건조 조건을 표준화한다.
    measure: 면적, 위치
  scratch:
    name_ko: 스크래치
    name_vi: Vết xước
    name_en: Scratch
    group: 표면 손상
    severity: major
    description: 표면에 생긴 선형 긁힘 또는 코팅 손상
    causes:
      - 취급·적재 중 부품 간 접촉
      - 지그·트레이·컨베이어 마찰
      - 조립 중 공구 또는 이물 접촉
    actions:
      immediate: 제품을 격리하고 길이·폭·깊이를 외관 기준과 비교한다.
      check: 지그와 이송 경로의 접촉·이물을 확인한다.
      prevent: 보호재를 사용하고 취급 공정을 점검한다.
    measure: 길이, 폭, 깊이, 위치
  stain:
    name_ko: 얼룩
    name_vi: Vết ố
    name_en: Stain
    group: 외관 오염
    severity: minor
    description: 표면에 남은 국부적인 색상 또는 광택 변화
    causes:
      - 세척 잔류물
      - 접착제·손자국·화학물질 접촉
      - 건조 및 보관 조건 불량
    actions:
      immediate: 승인된 세척 방법으로 제거 가능 여부를 확인한다.
      check: 세척액 농도와 건조 조건을 확인한다.
      prevent: 세척·건조·포장 조건을 표준화한다.
    measure: 면적, 위치
